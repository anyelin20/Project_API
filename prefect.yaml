---
name: Project_API
prefect-version: 3.6.18

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      id: clone
      repository: https://github.com/anyelin20/Project_API.git
      branch: main

  - prefect.deployments.steps.set_working_directory:
      directory: "{{ clone.directory }}"

  - prefect.deployments.steps.run_shell_script:
      script: python -m pip install -r requirements.txt --root-user-action=ignore

deployments:
  - name: project-api
    entrypoint: pipeline.py:main
    parameters: {}
    work_pool:
      name: api_pool
      job_variables: {}
    schedules: []

